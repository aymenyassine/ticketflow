services:
  #donner perm a kafka sur ses volumes
  kafka-init:
    image: apache/kafka:4.1.2
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command: "chown -R 1000:1000 /tmp/kraft-combined-logs"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: "no"
  kafka:
    image: apache/kafka:4.1.2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test: >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [ "start-dev" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Definir KC_ADMIN_PASSWORD dans infra/.env}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"

    ports:
      - "127.0.0.1:8180:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

    healthcheck:
      test: >-
        bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
        printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
        grep -q " 200 " <&3'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  mysql:
    image: mysql:8.4
    container_name: ticketflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: customer_service
      MYSQL_USER: ticketflow
      MYSQL_PASSWORD: ticketflow
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  kafka_data:
  keycloak_data:
